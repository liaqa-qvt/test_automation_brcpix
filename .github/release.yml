changelog:
  exclude:
    labels:
      - ignore-for-release
  categories:
    - title: "🚀 Novas funcionalidades"
      labels:
        - feat
        - feature
    - title: "🐛 Correções de bugs"
      labels:
        - fix
        - bugfix
    - title: "🧪 Testes"
      labels:
        - test
    - title: "🔧 Manutenção"
      labels:
        - chore
        - refactor
        - ci
    - title: "📝 Documentação"
      labels:
        - docs
    - title: "⬆️ Outras mudanças"
